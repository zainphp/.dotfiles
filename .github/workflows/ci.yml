name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    name: Shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Run tests
        run: |
          bash tests/backup.sh
          sh tests/install.sh
          bash tests/restore.sh
          zsh tests/paths.zsh
          zsh tests/ssh-add-key.zsh
