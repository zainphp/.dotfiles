name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Run tests
        run: |
          bash tests/backup.sh
          sh tests/install.sh
          bash tests/restore.sh
          zsh tests/paths.zsh
          zsh tests/ssh-add-key.zsh

  arch:
    name: Arch Linux
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: pacman -Syu --noconfirm git zsh

      - name: Run tests
        run: |
          bash tests/backup.sh
          sh tests/install.sh
          bash tests/restore.sh
          zsh tests/paths.zsh
          zsh tests/ssh-add-key.zsh
